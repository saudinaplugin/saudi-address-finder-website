<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Saudi Address Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1e293b;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #059669;
    background: rgba(5,150,105,0.1);
    border: 1px solid rgba(5,150,105,0.3);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 12px;
    font-weight: 700;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #475569;
    margin: 0 0 8px;
  }
  a {
    color: #059669;
  }
  footer {
    margin-top: 32px;
    font-size: 13px;
    color: #94a3b8;
  }
  .lang-toggle {
    position: fixed;
    top: 16px;
    inset-inline-end: 16px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    color: #1e293b;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <button id="lang-toggle-btn" class="lang-toggle">العربية</button>
  <div class="wrap">
    <div class="badge" data-i18n="badge">Now Available</div>
    <h1>Saudi Address Finder</h1>
    <p data-i18n="tagline1">A Shopify app that captures accurate Saudi National Addresses at checkout, so deliveries actually arrive.</p>
    <p data-i18n="tagline2">Available now on the Shopify App Store.</p>
    <div style="margin: 12px 0 20px;">
      <a href="https://apps.shopify.com/saudi-address-finder" target="_blank" rel="noopener" style="display:inline-block;">
        <img src="/assets/badge-shopify-app-store-dark.svg" alt="Available on the Shopify App Store" style="height: 44px;" />
      </a>
    </div>
    <footer data-i18n="footer">
      Questions? <a href="mailto:support@saudiaddressfinder.com">support@saudiaddressfinder.com</a> · <a href="/help.html">Help &amp; FAQ</a> · <a href="/privacy.html">Privacy Policy</a>
    </footer>
  </div>
  <script>
    window.PAGE_STRINGS = {
      badge: { en: "Now Available", ar: "متاح الآن" },
      tagline1: {
        en: "A Shopify app that captures accurate Saudi National Addresses at checkout, so deliveries actually arrive.",
        ar: "تطبيق شوبيفاي يلتقط العنوان الوطني السعودي بدقة عند الدفع، لضمان وصول الطلبات فعلياً."
      },
      tagline2: {
        en: "Available now on the Shopify App Store.",
        ar: "متاح الآن على متجر تطبيقات شوبيفاي."
      },
      footer: {
        en: 'Questions? <a href="mailto:support@saudiaddressfinder.com">support@saudiaddressfinder.com</a> · <a href="/help.html">Help &amp; FAQ</a> · <a href="/privacy.html">Privacy Policy</a>',
        ar: 'أسئلة؟ <a href="mailto:support@saudiaddressfinder.com">support@saudiaddressfinder.com</a> · <a href="/help.html">المساعدة والأسئلة الشائعة</a> · <a href="/privacy.html">سياسة الخصوصية</a>'
      }
    };
  </script>
  <script src="/lang.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
